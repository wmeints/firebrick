[env]
# Keep microsandbox's runtime, database and images for builds and tests out of
# the user's `~/.microsandbox`, so a newer `msb` migrating that database can't
# break the `vm-tests`. One fixed value for every cargo command: the
# `microsandbox` build script installs the runtime into `MSB_HOME` and reruns
# when it changes, so a per-command value would rebuild it on each switch. The
# path is short because unix socket paths can't exceed 108 bytes. An `MSB_HOME`
# set in the environment takes precedence.
MSB_HOME = "/tmp/firebrick-msb"
# Keep the VS Code-family and Zed settings that the in-process daemon of the
# `vm-tests` syncs out of the user's own, on Linux and macOS.
FIREBRICK_EDITOR_CONFIG_ROOT = { value = "/tmp/firebrick-test/config", force = true }
