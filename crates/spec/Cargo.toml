[package]
name = "firebrick-spec"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Parses and validates the .firebrick.yml sandbox spec."

[lints]
workspace = true

[dependencies]
firebrick-utils = { workspace = true }
oci-spec = { version = "0.10.0", default-features = false, features = ["distribution"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
thiserror = "2.0.21"

[target.'cfg(windows)'.dependencies]
# `FILE_FLAG_OPEN_REPARSE_POINT`, to open a spec file without following a symlink; the version
# tokio uses.
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.27.0"
