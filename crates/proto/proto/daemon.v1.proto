syntax = "proto3";

package firebrick;

service SandboxManagementService {
  rpc StartSandbox(StartSandboxRequest) returns (stream StartSandboxResponse);
  rpc StopSandbox(StopSandboxRequest) returns (StopSandboxResponse);
  rpc ListSandboxes(ListSandboxesRequest) returns (ListSandboxesResponse);
  rpc GetSandbox(GetSandboxRequest) returns (GetSandboxResponse);
  rpc RemoveSandbox(RemoveSandboxRequest) returns (RemoveSandboxResponse);
  rpc Attach(stream AttachRequest) returns (stream AttachResponse);
  rpc SshTunnel(stream SshTunnelRequest) returns (stream SshTunnelResponse);
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc RemoveSecret(RemoveSecretRequest) returns (RemoveSecretResponse);
  // Replaces the egress rules of an existing sandbox. The sandbox keeps its disk but not its
  // processes: it is recreated from a disk snapshot and ends in the state it was in. A sandbox
  // that already has the rules is left alone.
  rpc UpdateNetwork(UpdateNetworkRequest) returns (UpdateNetworkResponse);
  rpc ForwardPort(ForwardPortRequest) returns (ForwardPortResponse);
  rpc RemovePort(RemovePortRequest) returns (RemovePortResponse);
  // Returns the network activity fbkd recorded for a sandbox. Fails with FAILED_PRECONDITION
  // when the sandbox has no network log route, because it was created before network logging.
  rpc ListNetworkActivity(ListNetworkActivityRequest) returns (ListNetworkActivityResponse);
  // Recreates an existing sandbox from the latest version of an image, streaming the progress of
  // the image pull. The sandbox keeps its settings, secrets, network rules and ports, but gets a
  // fresh root filesystem and an empty Docker data disk, and ends in the state it was in. A
  // sandbox whose image already has the pulled digest is left alone. Fails with
  // FAILED_PRECONDITION for a paused sandbox.
  rpc UpgradeSandbox(UpgradeSandboxRequest) returns (stream UpgradeSandboxResponse);
}

message StartSandboxRequest {
  string name = 1;
  string image = 2;
  optional SandboxResources resources = 3;
  // Absolute host path, mounted read/write at /workspaces/<leaf-name>.
  string workspace = 4;
  // Whether the image's /sbin/init runs as PID 1. Unset means true.
  optional bool init = 5;
  // Unset means the default volume sizes.
  optional SandboxVolumes volumes = 6;
  // Whether fbkd trusts and installs the workspace's mise tools on start. Unset means true.
  optional bool mise = 7;
  // Egress rules, applied when the sandbox is created. Unset means microsandbox's default policy.
  optional NetworkPolicy network = 8;
  // Host ports to forward to the sandbox's loopback. Stored with the sandbox, and applied to a
  // running sandbox too. Unset keeps the stored list; an empty list means no forwards.
  optional PortForwards ports = 9;
  // Extra host directories to bind mount, besides the workspace. Applied when the sandbox is
  // created.
  repeated Mount mounts = 10;
  // Whether programs in the sandbox can read and write the host clipboard through fbkd. Applied
  // when the sandbox is created. Unset means false.
  optional bool clipboard = 11;
  // Environment variables every process in the sandbox gets, with their literal values. Stored
  // with the sandbox, and applied when it's created or the next time it starts; a running
  // sandbox keeps its environment. Unset keeps the stored variables.
  optional EnvVars env = 12;
  // The host's git identity for the workspace, written to the global git config of the
  // sandbox's default user whenever the sandbox runs after this request. Unset leaves the
  // sandbox's git config alone.
  optional GitIdentity git_identity = 13;
}

message GitIdentity {
  // The value for user.name. Unset leaves the sandbox's user.name alone.
  optional string name = 1;
  // The value for user.email. Unset leaves the sandbox's user.email alone.
  optional string email = 2;
}

message EnvVars {
  // Variable names map to their values. A name matches [A-Za-z_][A-Za-z0-9_]*, doesn't start
  // with MSB_ and isn't the name of a secret the sandbox gets.
  map<string, string> vars = 1;
}

message PortForwards {
  // No host port appears twice.
  repeated PortForward ports = 1;
}

message PortForward {
  // Port fbkd listens on at the host's loopback, from 1 to 65535.
  uint32 host = 1;
  // Port on the sandbox's 127.0.0.1 that connections reach, from 1 to 65535.
  uint32 guest = 2;
}

message PortForwardFailure {
  PortForward port = 1;
  // Why fbkd couldn't listen on the host port, e.g. because another process uses it.
  string reason = 2;
}

message Mount {
  // Canonical absolute host path of a directory.
  string host = 1;
  // Absolute guest path.
  string guest = 2;
  bool readonly = 3;
}

message NetworkPolicy {
  // Whether outgoing traffic is denied unless an allow rule matches. When false, the rules are
  // validated but not applied.
  bool enforce = 1;
  // Each rule is a host name, *.domain, an IP address or a CIDR range.
  repeated string allow = 2;
  // Deny rules win over allow rules.
  repeated string deny = 3;
  // Whether the sandbox gets a network device. Unset means enabled. When false, the sandbox
  // has no network at all and the other fields are validated but ignored.
  optional bool enabled = 4;
}

message SandboxResources {
  uint32 cpu = 1;
  string memory = 2;
}

message SandboxVolumes {
  // Size of the disk mounted at /var/lib/docker. Empty means the default of 20 GiB.
  string docker = 1;
}

// A stream of image pull and mise install progress, ending with the started sandbox. Errors end
// the stream with a status instead.
message StartSandboxResponse {
  reserved 1, 2;
  reserved "forwards", "failed_forwards";

  oneof message {
    // Sent while fbkd downloads the image of a sandbox it creates. Never sent when the image is
    // cached or the sandbox already exists. Best-effort: fbkd may skip messages.
    ImagePullProgress pull_progress = 3;
    // The last message of the stream, sent once the sandbox runs.
    SandboxStarted started = 4;
    // Sent while fbkd installs the mise tools of the workspace. Never sent when the workspace
    // has no mise config, mise is disabled or the image has no mise. Best-effort: fbkd may
    // skip messages.
    MiseInstallProgress mise_progress = 5;
  }
}

message MiseInstallProgress {
  // The latest line mise wrote, without control characters. Empty on the first message, sent
  // when the install starts, and on the last one.
  string line = 1;
  // Set on the last message, once mise installed the tools.
  bool complete = 2;
}

message ImagePullProgress {
  // Reference of the image being pulled, e.g. `ghcr.io/wmeints/firebrick-base:0.3.0`.
  string image = 1;
  // Bytes downloaded so far, over all layers.
  uint64 downloaded_bytes = 2;
  // Compressed size of all layers. Unset when the manifest has no layer sizes.
  optional uint64 total_bytes = 3;
  // Set on the last message of the pull, once the image is downloaded.
  bool complete = 4;
}

message SandboxStarted {
  // The forwards that are open for the sandbox, sorted by host port.
  repeated PortForward forwards = 1;
  // The forwards fbkd couldn't open. The sandbox still started.
  repeated PortForwardFailure failed_forwards = 2;
  // Set when the sandbox was already running and the requested environment variables differ
  // from the ones it runs with. They apply after the sandbox restarts.
  bool env_pending_restart = 3;
}

message StopSandboxRequest {
  string name = 1;
}

message StopSandboxResponse {}

message ListSandboxesRequest {}

message ListSandboxesResponse {
  repeated SandboxSummary sandboxes = 1;
}

message GetSandboxRequest {
  string name = 1;
}

message GetSandboxResponse {
  string name = 1;
  SandboxStatus status = 2;
  // SSH host name of the sandbox, e.g. `project.fbk`. Empty when it has none.
  string hostname = 3;
  // Guest path the workspace is mounted at, e.g. `/workspaces/project`. Empty when it has none.
  string workspace_path = 4;
  // Host directory mounted as the workspace, e.g. `/home/user/project`. Empty when it has none.
  string workspace_host_path = 5;
  // Image reference the sandbox was created from, e.g.
  // `ghcr.io/wmeints/firebrick-base:v0.8.0`. Empty when it's unknown.
  string image = 6;
  // The daemon's default image when the sandbox runs another `firebrick-base` image, so
  // `fbk upgrade` would move it to a newer release. Empty otherwise.
  string upgrade_image = 7;
}

message SandboxSummary {
  string name = 1;
  SandboxStatus status = 2;
  // SSH host name of the sandbox, e.g. `project.fbk`. Empty when it has none.
  string hostname = 3;
}

enum SandboxStatus {
  SANDBOX_STATUS_STOPPED = 0;
  SANDBOX_STATUS_RUNNING = 1;
  SANDBOX_STATUS_PAUSED = 2;
  SANDBOX_STATUS_STARTING = 3;
  SANDBOX_STATUS_STOPPING = 4;
  SANDBOX_STATUS_CRASHED = 5;
  // The sandbox runs, but its runtime didn't report whether it's paused. Only
  // ListSandboxes reports it; the other calls fail instead.
  SANDBOX_STATUS_UNKNOWN = 6;
}

message RemoveSandboxRequest {
  string name = 1;
  // Stops the sandbox first when it's running. Without it, removing a running
  // sandbox fails with FAILED_PRECONDITION.
  bool force = 2;
}

message RemoveSandboxResponse {}

message AttachRequest {
  oneof message {
    // Must be the first message on the stream, and only the first.
    AttachStart start = 1;
    AttachInput input = 2;
    AttachResize resize = 3;
  }
}

message AttachStart {
  string name = 1;
  string command = 2;
  repeated string args = 3;
  AttachResize size = 4;
}

message AttachInput {
  bytes data = 1;
}

message AttachResize {
  uint32 width = 1;
  uint32 height = 2;
}

message AttachResponse {
  oneof message {
    bytes output = 1;
    int32 exit_code = 2;
  }
}

message SshTunnelRequest {
  oneof message {
    // Must be the first message on the stream, and only the first.
    string hostname = 1;
    bytes data = 2;
  }
}

message SshTunnelResponse {
  bytes data = 1;
}

message SetSecretRequest {
  // Environment variable that exposes the secret's placeholder in sandboxes.
  string name = 1;
  string value = 2;
  // Hosts that may receive the real value. Empty uses the defaults for well-known names.
  repeated string allowed_hosts = 3;
  // Sandbox the secret belongs to, which must exist. It overrides a global secret with the same
  // name in that sandbox. Unset means global: every firebrick sandbox gets it, except the ones
  // with a sandbox-scoped secret with the same name.
  optional string sandbox = 4;
}

message SetSecretResponse {
  // Existing sandboxes the secret couldn't be added to.
  repeated string failed_sandboxes = 1;
}

message ListSecretsRequest {}

message ListSecretsResponse {
  // Sorted by name, then by scope with the global secret first. Values are never returned.
  repeated SecretSummary secrets = 1;
}

message SecretSummary {
  string name = 1;
  repeated string allowed_hosts = 2;
  // Sandbox the secret belongs to. Unset means global.
  optional string sandbox = 3;
}

message RemoveSecretRequest {
  string name = 1;
  // Sandbox to remove the secret from, which must exist. The sandbox gets the global secret with
  // the same name back, if there is one. Unset means global.
  optional string sandbox = 2;
}

message RemoveSecretResponse {
  // Existing sandboxes the secret couldn't be removed from. When there are any, the secret
  // stays stored, so removing it again retries them.
  repeated string failed_sandboxes = 1;
}

message UpdateNetworkRequest {
  string name = 1;
  // The complete new network section. Unset means microsandbox's default policy.
  NetworkPolicy network = 2;
}

message UpdateNetworkResponse {
  // Whether the sandbox was recreated. False when it already had the rules.
  bool updated = 1;
}

message ForwardPortRequest {
  // Name of the sandbox.
  string name = 1;
  // The forward to add to the sandbox's stored ports. It replaces a stored forward with the same
  // host port. Fails with FAILED_PRECONDITION when the sandbox runs and fbkd can't listen on
  // the host port, and then nothing changes.
  PortForward port = 2;
}

message ForwardPortResponse {
  // Whether the sandbox runs, so the forward is open now. Otherwise it opens when the sandbox
  // starts.
  bool running = 1;
}

message RemovePortRequest {
  // Name of the sandbox.
  string name = 1;
  // Host port of the forward to remove. Fails with NOT_FOUND when the sandbox doesn't forward it.
  uint32 host = 2;
}

message RemovePortResponse {
  // Whether the sandbox runs, so the forward was closed now.
  bool running = 1;
}

message ListNetworkActivityRequest {
  // Name of the sandbox.
  string name = 1;
}

message ListNetworkActivityResponse {
  // One entry per destination, sorted by last seen, newest first. The logger that reports the
  // activity runs inside the sandbox, so an agent can stop it or send false events.
  repeated NetworkActivity entries = 1;
}

enum NetworkActivityKind {
  // Never sent; a client shows it, like any kind it doesn't know, as unknown.
  NETWORK_ACTIVITY_KIND_UNSPECIFIED = 0;
  // A DNS lookup of a name.
  NETWORK_ACTIVITY_KIND_DNS = 1;
  // TCP connection attempts to an IP address.
  NETWORK_ACTIVITY_KIND_TCP = 2;
  // UDP datagrams to an IP address.
  NETWORK_ACTIVITY_KIND_UDP = 3;
}

message NetworkActivity {
  NetworkActivityKind kind = 1;
  // The DNS name for a lookup, or the IP address for a connection.
  string destination = 2;
  // The addresses the answers of a lookup held. Empty for a connection.
  repeated string addresses = 3;
  // The destination ports of a connection. Empty for a lookup.
  repeated uint32 ports = 4;
  // How often fbkd received the lookup or connection attempt.
  uint64 count = 5;
  // When fbkd first received it, in seconds since the Unix epoch.
  int64 first_seen = 6;
  // When fbkd last received it, in seconds since the Unix epoch.
  int64 last_seen = 7;
  // Whether the sandbox's current rules allow the destination, as fbkd evaluates them: domain
  // rules for a lookup, IP and CIDR rules for a connection. True for every entry when the rules
  // aren't enforced. This isn't microsandbox's own decision.
  bool allowed = 8;
}

message UpgradeSandboxRequest {
  // Name of the sandbox.
  string name = 1;
  // Image to upgrade the sandbox to. Empty means the default image of the daemon.
  string image = 2;
}

// A stream of image pull progress, ending with the result of the upgrade. Errors end the stream
// with a status instead.
message UpgradeSandboxResponse {
  oneof message {
    // Sent while fbkd downloads the image. Best-effort: fbkd may skip messages.
    ImagePullProgress pull_progress = 1;
    // The last message of the stream.
    SandboxUpgraded upgraded = 2;
  }
}

message SandboxUpgraded {
  // Whether the sandbox was recreated. False when its image already had the pulled digest.
  bool upgraded = 1;
  // Image the sandbox was created from before the upgrade.
  string old_image = 2;
  // Image the sandbox was upgraded to, or is already up to date with.
  string new_image = 3;
}
