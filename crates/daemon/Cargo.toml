[package]
name = "firebrick-daemon"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The fbkd daemon that manages Firebrick microVM sandboxes for coding agents."

[lints]
workspace = true

[[bin]]
name = "fbkd"
path = "src/main.rs"

[features]
# Integration tests that boot real microsandbox VMs.
vm-tests = []

[[test]]
name = "grpc"
required-features = ["vm-tests"]

[[test]]
name = "msb_home"
required-features = ["vm-tests"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full", "signal"] }
tonic = { version = "0.14.6", features = ["server"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
firebrick-utils = { workspace = true }
tracing-appender = "0.2.5"
# microsandbox pins microsandbox-network and microsandbox-image with `=`, so keep the versions
# equal.
microsandbox = { version = "0.7.8", features = ["ssh", "embed-binaries"] }
microsandbox-network = { version = "0.7.8", default-features = false }
microsandbox-image = { version = "0.7.8", default-features = false }
# The registry errors of image pulls; keep the version microsandbox-image uses.
oci-client = { version = "0.18.0", default-features = false }
russh = "0.64.1"
firebrick-proto = { workspace = true }
firebrick-spec = { workspace = true }
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
jsonc-parser = { version = "0.34.0", features = ["cst"] }
url = "2.5.8"
serde_json = "1.0.152"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }

[dev-dependencies]
hyper-util = { version = "0.1.21", features = ["tokio"] }
tower = "0.5.3"
tempfile = "3.27.0"
