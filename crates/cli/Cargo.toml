[package]
name = "firebrick-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The fbk CLI for running coding agents in Firebrick microVM sandboxes."

[lints]
workspace = true

[[bin]]
name = "fbk"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.53.2", features = ["full"] }
tonic = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
firebrick-utils = { workspace = true }
tower = "0.5.3"
hyper-util = { version = "0.1.21", features = ["tokio"] }
firebrick-proto = { workspace = true }
firebrick-spec = { workspace = true }
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
indicatif = "0.18.6"
# Canonical paths without the `\\?\` prefix on Windows, which microsandbox refuses in mounts;
# `std::fs::canonicalize` elsewhere (ADR 0051).
dunce = "1.0.5"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["user"] }

[target.'cfg(windows)'.dependencies]
# The console mode calls of crossterm, for VT input and output in `fbk run` (ADR 0051).
crossterm_winapi = "0.9.1"

[dev-dependencies]
indicatif = { version = "0.18.6", features = ["in_memory"] }
tempfile = "3.27.0"
