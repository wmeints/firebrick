name: Release

# The tag-release workflow calls this workflow after it tags a version bump on main,
# because a tag pushed with the GITHUB_TOKEN doesn't start the push trigger.
on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      tag:
        description: The release tag, such as v0.4.0
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A workflow call runs on main, so the tag comes from the input instead of the ref.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Build on the oldest supported Ubuntu so the binaries need glibc 2.35 at most.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          # microsandbox only supports Apple Silicon on macOS.
          - target: aarch64-apple-darwin
            runner: macos-latest
          # Windows is left out: fbk and fbkd depend on unix sockets and signals.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # Ubuntu 22.04's apt protoc (3.12) rejects proto3 optional fields, so install a current release.
      - uses: arduino/setup-protoc@v3
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Installs the Rust toolchain pinned in mise.toml.
      - uses: jdx/mise-action@v5

      # The binaries default to the firebrick-base image tagged with their version, so the tag must match it.
      - name: Check tag matches version
        shell: bash
        run: |
          pkgid=$(cargo pkgid -p firebrick-spec)
          version=${pkgid##*[#@]}
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match the workspace version v$version"
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked --bin fbk --bin fbkd

      # The CLI starts fbkd from its own directory, so both binaries ship side by side.
      - name: Package
        env:
          NAME: firebrick-${{ env.TAG }}-${{ matrix.target }}
        run: |
          mkdir "$NAME"
          cp target/release/fbk target/release/fbkd "$NAME/"
          tar -czf "$NAME.tar.gz" "$NAME"
          if [ "$RUNNER_OS" = macOS ]; then
            shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          else
            sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: firebrick-${{ matrix.target }}
          path: firebrick-${{ env.TAG }}-${{ matrix.target }}.tar.gz*
          if-no-files-found: error

  image:
    name: Publish firebrick-base image
    # Publish the image only once every package has built, so a failed build pushes nothing.
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build for both architectures so the image runs in sandboxes on x86_64 Linux and Apple Silicon.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/firebrick-base:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}

  publish:
    name: Publish crates to crates.io
    # Publish only once the packages and the image succeed, so a failed build publishes no crate.
    needs: [package, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing exchanges the workflow's OIDC token for a short-lived crates.io token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # firebrick-proto's build script needs protoc to verify the crate.
      - uses: arduino/setup-protoc@v3
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Installs the Rust toolchain pinned in mise.toml.
      - uses: jdx/mise-action@v5

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Cargo refuses to publish a version that exists, so skip the crates a partial earlier run published.
      # cargo publish orders the remaining crates by their dependencies.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          crates=$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[] | "\(.name) \(.version)"')
          packages=()
          while read -r name version; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -A "firebrick-release (https://github.com/${{ github.repository }})" \
              "https://crates.io/api/v1/crates/$name/$version")
            case "$status" in
              200) echo "$name $version is on crates.io already, skipping it" ;;
              404) packages+=(-p "$name") ;;
              *) echo "::error::crates.io answered $status for $name $version"; exit 1 ;;
            esac
          done <<< "$crates"
          if [ ${#packages[@]} -eq 0 ]; then
            echo "Every crate is on crates.io already"
            exit 0
          fi
          cargo publish --locked "${packages[@]}"

  release:
    name: Create GitHub release
    needs: [package, image, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # The notes start with the version's section of CHANGELOG.md, followed by the generated list of pull requests.
      - name: Extract release notes
        run: |
          awk -v tag="$TAG" '/^## /{p = ($2 == tag); next} p' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md has no section for $TAG; the release only gets generated notes"
          fi

      # Only the packages: the image job's build record (*.dockerbuild) can't be downloaded here.
      - uses: actions/download-artifact@v8
        with:
          pattern: firebrick-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true
          # Tags such as v0.2.0-rc.1 publish a pre-release.
          prerelease: ${{ contains(env.TAG, '-') }}
