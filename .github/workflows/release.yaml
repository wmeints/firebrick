name: Release

# The tag-release workflow calls this workflow after it tags a version bump on main,
# because a tag pushed with the GITHUB_TOKEN doesn't start the push trigger.
on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      tag:
        description: The release tag, such as v0.4.0
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A workflow call runs on main, so the tag comes from the input instead of the ref.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Build on the oldest supported Ubuntu so the binaries need glibc 2.35 at most.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            archive: tar.gz
          # microsandbox only supports Apple Silicon on macOS.
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          # A zip, because Windows extracts it without extra tools.
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      # Installs the Rust toolchain and protoc pinned in mise.toml. Ubuntu 22.04's apt protoc (3.12)
      # rejects proto3 optional fields.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          # Only what the build needs, so no other tool runs in this privileged job.
          install_args: rust protoc
          # Pin mise itself; it verifies the checksums in mise.lock.
          version: 2026.9.10

      # The binaries default to the firebrick-base image tagged with their version, so the tag must match it.
      - name: Check tag matches version
        shell: bash
        run: |
          pkgid=$(cargo pkgid -p firebrick-spec)
          version=${pkgid##*[#@]}
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match the workspace version v$version"
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked --bin fbk --bin fbkd

      # The CLI starts fbkd from its own directory, so both binaries ship side by side.
      # On Windows the binaries end in .exe, and Git Bash provides sha256sum and the runner 7z.
      - name: Package
        shell: bash
        env:
          NAME: firebrick-${{ env.TAG }}-${{ matrix.target }}
          ARCHIVE: firebrick-${{ env.TAG }}-${{ matrix.target }}.${{ matrix.archive }}
        run: |
          mkdir "$NAME"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/fbk.exe target/release/fbkd.exe "$NAME/"
            7z a -tzip "$ARCHIVE" "$NAME"
          else
            cp target/release/fbk target/release/fbkd "$NAME/"
            tar -czf "$ARCHIVE" "$NAME"
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            # Git Bash's sha256sum marks binary mode with "*"; keep the line the same on every target.
            sha256sum "$ARCHIVE" | sed 's/ \*/  /' > "$ARCHIVE.sha256"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firebrick-${{ matrix.target }}
          path: firebrick-${{ env.TAG }}-${{ matrix.target }}.${{ matrix.archive }}*
          if-no-files-found: error

  image:
    name: Publish firebrick-base image
    # Publish the image only once every package has built, so a failed build pushes nothing.
    needs: package
    # The release environment waits for a required reviewer, so a compromised action can't push without approval.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build for both architectures so the image runs in sandboxes on x86_64 Linux and Apple Silicon.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/firebrick-base:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}

  publish:
    name: Publish crates to crates.io
    # Publish only once the packages and the image succeed, so a failed build publishes no crate.
    needs: [package, image]
    # crates.io accepts only OIDC tokens with the release environment claim, which a job gets after approval.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing exchanges the workflow's OIDC token for a short-lived crates.io token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      # Installs the Rust toolchain and the protoc that firebrick-proto's build script needs to verify the crate.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          # Only what the build needs, so no other tool runs in this privileged job.
          install_args: rust protoc
          # Pin mise itself; it verifies the checksums in mise.lock.
          version: 2026.9.10

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      # Cargo refuses to publish a version that exists, so skip the crates a partial earlier run published.
      # cargo publish orders the remaining crates by their dependencies.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          crates=$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[] | "\(.name) \(.version)"')
          packages=()
          while read -r name version; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -A "firebrick-release (https://github.com/${{ github.repository }})" \
              "https://crates.io/api/v1/crates/$name/$version")
            case "$status" in
              200) echo "$name $version is on crates.io already, skipping it" ;;
              404) packages+=(-p "$name") ;;
              *) echo "::error::crates.io answered $status for $name $version"; exit 1 ;;
            esac
          done <<< "$crates"
          if [ ${#packages[@]} -eq 0 ]; then
            echo "Every crate is on crates.io already"
            exit 0
          fi
          cargo publish --locked "${packages[@]}"

  release:
    name: Create GitHub release
    needs: [package, image, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      # The notes start with the version's section of CHANGELOG.md, followed by the generated list of pull requests.
      - name: Extract release notes
        run: |
          awk -v tag="$TAG" '/^## /{p = ($2 == tag); next} p' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md has no section for $TAG; the release only gets generated notes"
          fi

      # Only the packages: the image job's build record (*.dockerbuild) can't be downloaded here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: firebrick-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true
          # Tags such as v0.2.0-rc.1 publish a pre-release.
          prerelease: ${{ contains(env.TAG, '-') }}

  homebrew:
    name: Update Homebrew formula
    # Update the tap only once the GitHub release has the archives the formula downloads.
    needs: release
    # Pre-releases don't go to the tap. The env context isn't available in a job's if.
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    # The tap token writes outside this repository, so pushing with it waits for approval, like image and publish.
    # It's a secret of the release environment, which a called workflow's job reads without the caller passing it.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wmeints/homebrew-tap
          ref: main
          path: homebrew-tap
          # A fine-grained token with only contents: write on wmeints/homebrew-tap. Only the push step gets it,
          # so the steps before it never see the token.
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: firebrick-*
          path: dist
          merge-multiple: true

      # Rerunning an older release's failed job must not roll the tap back to that release.
      - name: Render formula
        env:
          FORMULA: homebrew-tap/Formula/firebrick.rb
        run: |
          if [ -f "$FORMULA" ]; then
            current=$(grep -m1 -o 'releases/download/v[0-9.]*/' "$FORMULA" || true)
            current=${current#releases/download/v}
            current=${current%/}
            newest=$(printf '%s\n%s\n' "$current" "${TAG#v}" | sort -V | tail -n1)
            if [ -n "$current" ] && [ "$newest" != "${TAG#v}" ]; then
              echo "::notice::The tap has firebrick $current, which is newer than $TAG; leaving it"
              exit 0
            fi
          fi
          mkdir -p homebrew-tap/Formula
          .github/scripts/homebrew-formula.sh "$TAG" dist > "$FORMULA"

      # A rerun after the tap was updated finds the formula unchanged and pushes nothing.
      - name: Push formula
        working-directory: homebrew-tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git add Formula/firebrick.rb
          if git diff --cached --quiet; then
            echo "The tap has the formula for $TAG already"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "firebrick ${TAG#v}"
          git push "https://x-access-token:$TOKEN@github.com/wmeints/homebrew-tap.git" HEAD:main

  winget:
    name: Submit winget manifests
    # Submit only once the GitHub release has the archive the manifests download.
    needs: release
    # Pre-releases don't go to winget. The env context isn't available in a job's if.
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    # The winget token opens pull requests outside this repository, so submitting waits for approval, like homebrew.
    # It's a secret of the release environment, which a called workflow's job reads without the caller passing it.
    environment: release
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firebrick-x86_64-pc-windows-msvc
          path: dist

      - name: Render manifests
        run: .github/scripts/winget-manifests.sh "$TAG" "dist/firebrick-$TAG-x86_64-pc-windows-msvc.zip.sha256" manifests

      # A rerun after microsoft/winget-pkgs has the version submits nothing.
      - name: Check for a published version
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/w/wmeints/Firebrick/${TAG#v}")
          case "$status" in
            200)
              echo "::notice::microsoft/winget-pkgs has wmeints.Firebrick ${TAG#v} already"
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::GitHub answered $status for the wmeints.Firebrick manifests"; exit 1 ;;
          esac

      # A pinned release checked against its checksum, instead of the unversioned aka.ms/wingetcreate/latest link.
      - name: Download wingetcreate
        if: steps.published.outputs.exists == 'false'
        env:
          # wingetcreate v1.12.13.0
          URL: https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe
          SHA256: 24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea
        run: |
          curl -fsSL -o "$RUNNER_TEMP/wingetcreate.exe" "$URL"
          echo "$SHA256  $RUNNER_TEMP/wingetcreate.exe" | sha256sum -c -

      # wingetcreate forks microsoft/winget-pkgs with the token and opens the pull request from the fork.
      - name: Submit manifests
        if: steps.published.outputs.exists == 'false'
        env:
          # A classic token with public_repo. Only this step gets it.
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        # Without a token wingetcreate starts an interactive device login and waits for it to expire.
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "::error::WINGET_TOKEN isn't set in the release environment"
            exit 1
          fi
          "$RUNNER_TEMP/wingetcreate.exe" submit \
            --prtitle "New version: wmeints.Firebrick version ${TAG#v}" \
            --token "$WINGET_TOKEN" \
            manifests
