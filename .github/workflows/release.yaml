name: Release

# The tag-release workflow calls this workflow after it tags a version bump on main,
# because a tag pushed with the GITHUB_TOKEN doesn't start the push trigger.
on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      tag:
        description: The release tag, such as v0.4.0
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A workflow call runs on main, so the tag comes from the input instead of the ref.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Build on the oldest supported Ubuntu so the binaries need glibc 2.35 at most.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          # microsandbox only supports Apple Silicon on macOS.
          - target: aarch64-apple-darwin
            runner: macos-latest
          # Windows is left out: fbk and fbkd depend on unix sockets and signals.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      # Installs the Rust toolchain and protoc pinned in mise.toml. Ubuntu 22.04's apt protoc (3.12)
      # rejects proto3 optional fields.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # Only what the build needs, so no other tool runs in this privileged job.
          install_args: rust protoc
          # Pin mise itself; it verifies the checksums in mise.lock.
          version: 2026.9.10

      # The binaries default to the firebrick-base image tagged with their version, so the tag must match it.
      - name: Check tag matches version
        shell: bash
        run: |
          pkgid=$(cargo pkgid -p firebrick-spec)
          version=${pkgid##*[#@]}
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match the workspace version v$version"
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked --bin fbk --bin fbkd

      # The CLI starts fbkd from its own directory, so both binaries ship side by side.
      - name: Package
        env:
          NAME: firebrick-${{ env.TAG }}-${{ matrix.target }}
        run: |
          mkdir "$NAME"
          cp target/release/fbk target/release/fbkd "$NAME/"
          tar -czf "$NAME.tar.gz" "$NAME"
          if [ "$RUNNER_OS" = macOS ]; then
            shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          else
            sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firebrick-${{ matrix.target }}
          path: firebrick-${{ env.TAG }}-${{ matrix.target }}.tar.gz*
          if-no-files-found: error

  image:
    name: Publish firebrick-base image
    # Publish the image only once every package has built, so a failed build pushes nothing.
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build for both architectures so the image runs in sandboxes on x86_64 Linux and Apple Silicon.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/firebrick-base:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}

  publish:
    name: Publish crates to crates.io
    # Publish only once the packages and the image succeed, so a failed build publishes no crate.
    needs: [package, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing exchanges the workflow's OIDC token for a short-lived crates.io token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      # Installs the Rust toolchain and the protoc that firebrick-proto's build script needs to verify the crate.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # Only what the build needs, so no other tool runs in this privileged job.
          install_args: rust protoc
          # Pin mise itself; it verifies the checksums in mise.lock.
          version: 2026.9.10

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      # Cargo refuses to publish a version that exists, so skip the crates a partial earlier run published.
      # cargo publish orders the remaining crates by their dependencies.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          crates=$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[] | "\(.name) \(.version)"')
          packages=()
          while read -r name version; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -A "firebrick-release (https://github.com/${{ github.repository }})" \
              "https://crates.io/api/v1/crates/$name/$version")
            case "$status" in
              200) echo "$name $version is on crates.io already, skipping it" ;;
              404) packages+=(-p "$name") ;;
              *) echo "::error::crates.io answered $status for $name $version"; exit 1 ;;
            esac
          done <<< "$crates"
          if [ ${#packages[@]} -eq 0 ]; then
            echo "Every crate is on crates.io already"
            exit 0
          fi
          cargo publish --locked "${packages[@]}"

  release:
    name: Create GitHub release
    needs: [package, image, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      # The notes start with the version's section of CHANGELOG.md, followed by the generated list of pull requests.
      - name: Extract release notes
        run: |
          awk -v tag="$TAG" '/^## /{p = ($2 == tag); next} p' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md has no section for $TAG; the release only gets generated notes"
          fi

      # Only the packages: the image job's build record (*.dockerbuild) can't be downloaded here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: firebrick-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true
          # Tags such as v0.2.0-rc.1 publish a pre-release.
          prerelease: ${{ contains(env.TAG, '-') }}
