name: CI

# Build and test the crates when the Rust sources, the Cargo configuration, the
# pinned toolchain or this workflow change. markdown.yaml and actionlint.yaml
# check the rest of the repository.
on:
  push:
    branches: [main]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - clippy.toml
      - mise.toml
      - mise.lock
      - .github/workflows/ci.yaml
  pull_request:
    branches: [main]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - clippy.toml
      - mise.toml
      - mise.lock
      - .github/workflows/ci.yaml
  workflow_dispatch:

# Cancel superseded PR runs, but build every commit on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the Rust toolchain, protoc and the other tools pinned in mise.toml.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # Pin mise itself; it verifies the checksums in mise.lock.
          version: 2026.9.10

      # One cache for both jobs, so the integration tests reuse the
      # dependencies this job compiled.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: workspace

      # The microsandbox build script installs the msb runtime into MSB_HOME
      # (/tmp/firebrick-msb, see .cargo/config.toml) and reruns when the
      # runtime's files change. Cargo dates a build script run to when it
      # started, so a runtime installed during the run looks changed to the
      # next cargo command, which then recompiles microsandbox and every crate
      # that depends on it. Restoring the runtime and dating it before any
      # build keeps the cached microsandbox fresh.
      - name: Restore the microsandbox runtime
        id: msb-runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/firebrick-msb/bin
            /tmp/firebrick-msb/lib
          key: msb-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Date the microsandbox runtime before the cached builds
        if: steps.msb-runtime.outputs.cache-hit == 'true'
        run: find /tmp/firebrick-msb/bin /tmp/firebrick-msb/lib -exec touch -h -d 2000-01-01 {} +

      - name: Check formatting
        run: cargo fmt --all --check

      # Clippy checks every target and the unit tests build them, so there's no
      # separate build step.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

  # Builds, lints and unit tests the Windows port (ADR 0050). GitHub's Windows
  # runners have no Windows Hypervisor Platform, so the vm-tests run on Windows
  # only locally, with `mise run integration-tests`.
  windows:
    name: Windows format, lint and unit tests
    runs-on: windows-latest
    env:
      # The runner may create symlinks, so the tests that check how firebrick treats them run
      # here; a developer's Windows without Developer Mode can't, and stops them early.
      FIREBRICK_TEST_SYMLINKS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # Pin mise itself; it verifies the checksums in mise.lock.
          version: 2026.9.10

      # A cache of its own: the Windows build shares nothing with the Linux one.
      # The microsandbox runtime isn't cached, so a cargo command may recompile
      # microsandbox after the build script installed it (see the check job).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

  integration:
    name: Integration tests (microVMs)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # microsandbox boots VMs through KVM; give the runner user access to it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # Pin mise itself; it verifies the checksums in mise.lock.
          version: 2026.9.10

      # Restores the cache the check job saved; only firebrick-daemon compiles
      # again, for the vm-tests feature.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: workspace
          save-if: false

      # See the check job: a runtime installed by the build script would
      # recompile microsandbox.
      - name: Restore the microsandbox runtime
        id: msb-runtime
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/firebrick-msb/bin
            /tmp/firebrick-msb/lib
          key: msb-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Date the microsandbox runtime before the cached builds
        if: steps.msb-runtime.outputs.cache-hit == 'true'
        run: find /tmp/firebrick-msb/bin /tmp/firebrick-msb/lib -exec touch -h -d 2000-01-01 {} +

      # The network log tests need the per-user runtime directory, which a runner
      # without a login session may not have.
      - name: Integration tests
        run: |
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-$RUNNER_TEMP/xdg-runtime}"
          [ -d "$XDG_RUNTIME_DIR" ] || mkdir -m 700 "$XDG_RUNTIME_DIR"
          cargo test -p firebrick-daemon --features vm-tests
