name: Workflows

# Lint the GitHub workflows when they or the pinned actionlint and shellcheck
# versions change (ADR 0009).
on:
  push:
    branches: [main]
    paths: [.github/workflows/**, mise.toml]
  pull_request:
    branches: [main]
    paths: [.github/workflows/**, mise.toml]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs only the actionlint and shellcheck versions pinned in
      # mise.toml; actionlint runs shellcheck on the run steps.
      - uses: jdx/mise-action@v5
        with:
          install_args: actionlint shellcheck

      - name: Lint workflows
        run: actionlint
