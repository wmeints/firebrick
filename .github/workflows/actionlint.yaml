name: Workflows

# Lint the GitHub workflows when they or the pinned actionlint and shellcheck
# versions change (ADR 0009).
on:
  push:
    branches: [main]
    paths: [.github/workflows/**, mise.toml, mise.lock]
  pull_request:
    branches: [main]
    paths: [.github/workflows/**, mise.toml, mise.lock]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs only the actionlint and shellcheck versions pinned in
      # mise.toml; actionlint runs shellcheck on the run steps.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          # Pin mise itself; it verifies the checksums in mise.lock.
          version: 2026.9.10
          install_args: actionlint shellcheck

      - name: Lint workflows
        run: actionlint
