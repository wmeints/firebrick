name: Markdown

# Check the formatting of the Markdown files when they, the dprint
# configuration, the pinned dprint version or this workflow change.
on:
  push:
    branches: [main]
    paths: ["**/*.md", dprint.json, mise.toml, mise.lock, .github/workflows/markdown.yaml]
  pull_request:
    branches: [main]
    paths: ["**/*.md", dprint.json, mise.toml, mise.lock, .github/workflows/markdown.yaml]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dprint:
    name: Check Markdown formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs only the dprint version pinned in mise.toml.
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          # Pin mise itself; it verifies the checksums in mise.lock.
          version: 2026.9.10
          install_args: dprint

      - name: Check formatting
        run: dprint check
