name: Website

# Check the website when it, the pinned Node and pnpm versions, or this workflow
# change. Only the release workflow deploys it to GitHub Pages, by calling this
# workflow with the release tag, so the published docs match the latest release.
on:
  push:
    branches: [main]
    paths: [website/**, mise.toml, mise.lock, .github/workflows/website.yaml]
  pull_request:
    branches: [main]
    paths: [website/**, mise.toml, mise.lock, .github/workflows/website.yaml]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: The release tag to check out and deploy, such as v0.4.0
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: website

jobs:
  check:
    name: Lint, test and build the website
    runs-on: ubuntu-latest
    steps:
      # A release checks out its tag; other runs check out the triggering ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      # Installs only the Node and pnpm versions pinned in mise.toml.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          # Pin mise itself; it verifies the checksums in mise.lock.
          version: 2026.9.10
          install_args: node pnpm

      # Fails when a dependency wants to run an install script that
      # pnpm-workspace.yaml doesn't allow.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check

      - name: Unit tests
        run: pnpm run test

      # Fails on broken links in the docs.
      - name: Build
        run: pnpm run build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm run test:e2e

      # The deploy job publishes this build, so it isn't built twice.
      - name: Upload the site for GitHub Pages
        if: inputs.tag
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  # Publishes the site checked above when the release workflow calls this one.
  # GitHub Pages must use "GitHub Actions" as its source in the repository
  # settings.
  deploy:
    name: Deploy the website to GitHub Pages
    if: inputs.tag
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
