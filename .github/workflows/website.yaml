name: Website

# Check the website when it, the pinned Node and pnpm versions, or this workflow
# change, and deploy it to GitHub Pages from main.
on:
  push:
    branches: [main]
    paths: [website/**, mise.toml, .github/workflows/website.yaml]
  pull_request:
    branches: [main]
    paths: [website/**, mise.toml, .github/workflows/website.yaml]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: website

jobs:
  check:
    name: Lint, test and build the website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs only the Node and pnpm versions pinned in mise.toml.
      - uses: jdx/mise-action@v2
        with:
          install_args: node pnpm

      # Fails when a dependency wants to run an install script that
      # pnpm-workspace.yaml doesn't allow.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check

      - name: Unit tests
        run: pnpm run test

      # Fails on broken links in the docs.
      - name: Build
        run: pnpm run build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm run test:e2e

      # The deploy job publishes this build, so it isn't built twice.
      - name: Upload the site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  # Publishes the site checked above on pushes to main, or when run by hand on
  # main. GitHub Pages must use "GitHub Actions" as its source in the repository
  # settings.
  deploy:
    name: Deploy the website to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
