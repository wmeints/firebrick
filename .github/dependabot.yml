# Keeps the commit SHAs the workflows pin their actions to, and the digest the
# Dockerfile pins its base image to, up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised tag is
    # likely caught and pulled before it reaches a pull request.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Same wait as for the actions: a retagged base image is likely caught
    # before it reaches a pull request.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
