# Git hooks for Firebrick. `mise install` runs `lefthook install` to activate them.

pre-commit:
  parallel: false
  commands:
    format:
      glob: "*.rs"
      run: cargo fmt --all --check
    markdown:
      glob: "*.md"
      run: dprint check
    workflows:
      glob: ".github/workflows/*.{yaml,yml}"
      run: actionlint
    # Clippy and the unit tests run only for the Rust inputs that ci.yaml
    # filters on; mise.toml and mise.lock pin the Rust toolchain.
    clippy:
      glob: &rust-inputs ["*.rs", "*.proto", "Cargo.toml", "**/Cargo.toml", "Cargo.lock", ".cargo/config.toml", "clippy.toml", "mise.toml", "mise.lock"]
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    unit-tests:
      glob: *rust-inputs
      run: cargo test --workspace
    # The website's end-to-end tests need a browser, so they run in CI and in
    # the Claude Code stop hook instead.
    website:
      # mise.toml and mise.lock pin Node and pnpm.
      glob: ["website/**", "mise.toml", "mise.lock"]
      run: >-
        pnpm --dir website install --frozen-lockfile &&
        pnpm --dir website run format:check &&
        pnpm --dir website run lint &&
        pnpm --dir website run check &&
        pnpm --dir website run test &&
        pnpm --dir website run build

commit-msg:
  scripts:
    # Enforces https://www.conventionalcommits.org: `type(scope)!: description`.
    "conventional-commit.sh":
      runner: bash

