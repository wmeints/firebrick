[tools]
"aqua:rustsec/rustsec/cargo-audit" = "0.22.2"
actionlint = "1.7.12"
buf = "1.73.0"
claude = "2.1.295"
dprint = "0.61.1"
gh = "2.102.0"
lefthook = "2.2.1"
node = "24.21.0"
pnpm = "12.10.1"
protoc = "36.2"
rust = { version = "1.99.0", components = "rustfmt,clippy,rust-src,rust-analyzer" }
shellcheck = "0.11.0"

[hooks]
# Install the git hooks from lefthook.yml after `mise install`.
postinstall = "lefthook install"

# Development tasks. Run them with `mise run <task>`, list them with `mise tasks`.
[tasks.lint]
description = "Lint every crate, including the vm-tests integration tests"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.unit-tests]
description = "Run the unit tests"
run = "cargo test --workspace"

[tasks.integration-tests]
description = "Run the integration tests that boot real microsandbox VMs"
run = "cargo test -p firebrick-daemon --features vm-tests"
# Cargo's job object keeps microsandbox from starting VMs on Windows, so the
# script runs the test binaries itself (ADR 0050).
run_windows = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/vm-tests.ps1"

[tasks.registry]
description = "Make sure the local image registry serves on 127.0.0.1:5000"
# mise renders the script as a Tera template, so it can't use docker's Go
# template formats.
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ -n "$(docker ps -q --filter name='^registry$')" ]; then
  exit 0
elif [ -n "$(docker ps -aq --filter name='^registry$')" ]; then
  docker start registry >/dev/null
else
  docker run -d -p 127.0.0.1:5000:5000 --name registry registry:2 >/dev/null
fi
'''

[tasks.install-dev]
description = "Install fbk and fbkd, and push the firebrick-base image to the local registry"
depends = ["registry"]
run = [
  "cargo install --locked --path crates/cli",
  "cargo install --locked --path crates/daemon",
  "docker build -t localhost:5000/firebrick-base:dev .",
  "docker push localhost:5000/firebrick-base:dev",
]
