[tools]
actionlint = "1.7.12"
buf = "1.73.0"
claude = "2.1.295"
dprint = "0.61.1"
gh = "2.102.0"
lefthook = "2.2.1"
node = "24.21.0"
pnpm = "12.10.1"
protoc = "36.2"
rust = { version = "1.99.0", components = "rustfmt,clippy,rust-src,rust-analyzer" }
shellcheck = "0.11.0"

[hooks]
# Install the git hooks from lefthook.yml after `mise install`.
postinstall = "lefthook install"
